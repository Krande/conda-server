name: Review Pull Request

# Thin wrapper: all the logic lives in the `deputy` package
# (https://github.com/Krande/deputy), unit-tested locally — no more debugging
# Python by pushing commits and reading Actions logs. This workflow just
# installs deputy and runs the pr-review command, which checks the PR
# (conventional title + exactly one release-* label), computes the next version
# for information, and posts/updates a single sticky comment.
#
# Config lives in deputy.toml at the repo root: [pr_review].marker keeps the
# original sticky-comment thread, and [release] supplies the version location
# (the rest of the semantic-release config is deputy's built-in defaults).
#
# pull_request_target so the job (and GITHUB_TOKEN) can comment + label even on
# fork PRs. It checks out the BASE ref only and never runs any PR-head code.

on:
  pull_request_target:
    types: [opened, synchronize, edited, unlabeled]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: Check Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base ref (full history for the version calc)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # base branch — never the untrusted PR head
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deputy
        run: pip install "deputy @ git+https://github.com/Krande/deputy.git@v0.2.0"

      - name: Review the PR (checks + sticky comment); fails if a check fails
        run: deputy pr-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_SOURCE_KEY: ${{ secrets.SOURCE_KEY != '' }}
