[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conda-server"
version = "0.2.1"
description = "A modern, open-source conda package server built on the rattler ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Kristoffer Andersen" }]
keywords = ["conda", "rattler", "package-server", "mamba", "pixi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Packaging",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.19",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "authlib>=1.3",
    "joserfc>=0.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "obstore>=0.3",
    "py-rattler>=0.23",
    "typer>=0.12",
    "itsdangerous>=2.2",
    "rich>=13.7",
    "zstandard>=0.22",
    "msgpack>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.2",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
conda-server = "conda_server.cli:app"

[project.urls]
Homepage = "https://github.com/Krande/conda-server"
Issues = "https://github.com/Krande/conda-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/conda_server"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
