[workspace]
name = "conda-server"
version = "0.0.1"
description = "A modern, open-source conda package server built on the rattler ecosystem"
authors = ["Kristoffer Andersen"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[environments]
default = { features = ["prod"], solve-group = "default" }
dev = { features = ["prod", "dev"], solve-group = "default" }
# Isolated, minimal env whose linters are pinned to the exact versions CI
# runs (see action_config.toml [tool.python.lint]). Its own solve-group keeps
# these hard pins from constraining the app's dependency solve.
lint = { features = ["lint"], solve-group = "lint" }

[feature.prod.dependencies]
python = "3.12.*"
pip = "*"
fastapi = ">=0.110"
uvicorn = ">=0.27"
sqlalchemy = ">=2.0"
alembic = ">=1.13"
asyncpg = ">=0.29"
aiosqlite = ">=0.19"
pydantic = ">=2.6"
pydantic-settings = ">=2.2"
authlib = ">=1.3"
joserfc = ">=0.9"
python-multipart = ">=0.0.9"
httpx = ">=0.27"
structlog = ">=24.1"
prometheus_client = ">=0.20"
py-rattler = ">=0.23"
typer = ">=0.12"
itsdangerous = ">=2.2"
rich = ">=13.7"
# CEP-16 sharded repodata parsing: shards are msgpack-encoded blobs
# wrapped in zstd. Used by the import-from-upstream search endpoint.
zstandard = ">=0.22"
msgpack-python = ">=1.0"

[feature.prod.pypi-dependencies]
obstore = ">=0.3"
conda-server = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
pytest-mock = ">=3.12"
pytest-timeout = ">=2.2"
ruff = ">=0.4"
mypy = ">=1.10"
nodejs = "*"

# ruff (formatter + linter, incl. the `I` import-sort rule) is the single
# source of truth for style here, pinned to the exact version CI enforces
# (action_config.toml [tool.python.lint]). black/isort are intentionally
# NOT used — they disagree with `ruff format`, and mixing them would make
# lint uncloseable.
[feature.lint.dependencies]
python = "3.12.*"
ruff = "==0.16.3"

[feature.lint.tasks]
lint = { cmd = "ruff format --check src tests && ruff check src tests", description = "Check formatting + lint with the CI-pinned ruff" }

[feature.prod.tasks]
serve = { cmd = "uvicorn conda_server.app:create_app --factory --host 0.0.0.0 --port 8000 --reload", description = "Run the API server (dev mode with reload)" }
migrate = { cmd = "alembic upgrade head", description = "Apply database migrations" }
makemigration = { cmd = "alembic revision --autogenerate -m", description = "Generate a new migration (pass a message)" }
reindex = { cmd = "conda-server reindex", description = "Reindex a channel from object storage" }

[feature.dev.tasks]
test = { cmd = "pytest -q", description = "Run the test suite" }
format = { cmd = "ruff format src tests", description = "Format the codebase" }
typecheck = { cmd = "mypy src", description = "Type-check the codebase" }
frontend-install = { cmd = "npm install", cwd = "frontend", description = "Install frontend deps" }
frontend-dev = { cmd = "npm run dev", cwd = "frontend", description = "Run Vite dev server (proxies /api to backend on :8000)" }
frontend-build = { cmd = "npm run build", cwd = "frontend", description = "Build the SPA into frontend/dist" }
frontend-lint = { cmd = "npm run lint", cwd = "frontend", description = "Lint the frontend" }

# End-to-end tests. `e2e-server` is launched by Playwright's webServer
# config (see frontend/playwright.config.ts); don't call it directly.
# Use `pixi run e2e` from a fresh checkout — it builds the frontend
# first, then runs playwright.
e2e-server = { cmd = "rm -f /tmp/conda-server-e2e.db && alembic upgrade head && uvicorn conda_server.app:create_app --factory --host 127.0.0.1 --port 8001", description = "Backend for Playwright (test config, not for humans)", env = { CONDA_SERVER_DATABASE__URL = "sqlite+aiosqlite:////tmp/conda-server-e2e.db", CONDA_SERVER_STORAGE__BACKEND = "local", CONDA_SERVER_STORAGE__URL = "/tmp/conda-server-e2e", CONDA_SERVER_AUTH__SESSION_SECRET = "test-secret-not-for-production-use-at-all", CONDA_SERVER_AUTH__SESSION_HTTPS_ONLY = "false", CONDA_SERVER_LOGGING__FORMAT = "console" } }
e2e = { cmd = "npm run test:e2e", cwd = "frontend", depends-on = ["frontend-build"], description = "Run Playwright smoke tests (builds the frontend first, spawns backend)" }
e2e-install = { cmd = "npx playwright install --with-deps chromium", cwd = "frontend", description = "Install Playwright's browser binary (once per machine)" }

[feature.prod.tasks.docker-build]
cmd = "docker build -t conda-server:dev ."
description = "Build the production Docker image"

[feature.prod.tasks.docker-up]
cmd = "docker compose up --build"
description = "Start conda-server via docker compose"
