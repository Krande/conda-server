<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern, open-source conda package server built on the rattler ecosystem." />
    <title>conda-server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted/system theme + accent palette before paint to avoid a
      // flash of the wrong theme or accent. Keep in sync with
      // __themeBootSnippet in src/lib/theme.ts.
      (function () {
        try {
          var r = document.documentElement;
          var s = localStorage.getItem("conda-server:theme");
          var t = s === "dark" || s === "light"
            ? s
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          if (t === "dark") r.classList.add("dark");
          r.style.colorScheme = t;
          var p = localStorage.getItem("conda-server:palette");
          var valid = ["amber", "emerald", "indigo", "ocean", "rose", "graphite"];
          r.dataset.palette = valid.indexOf(p) >= 0 ? p : "amber";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
