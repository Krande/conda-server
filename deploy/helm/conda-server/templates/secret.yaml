{{/*
Only created when the operator hasn't pointed us at an existing Secret.
For prod: prefer existingSecret + ExternalSecret/SealedSecret/Vault
operator. The inline path is here so the chart works out of the box for
dev installs.
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conda-server.secretName" . }}
  labels:
    {{- include "conda-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secretKeys.sessionSecret }}: {{ required "secrets.values.sessionSecret is required (openssl rand -hex 32)" .Values.secrets.values.sessionSecret | quote }}
  {{ .Values.secretKeys.oidcClientId }}: {{ .Values.secrets.values.oidcClientId | default "" | quote }}
  {{ .Values.secretKeys.oidcClientSecret }}: {{ .Values.secrets.values.oidcClientSecret | default "" | quote }}
  {{ .Values.secretKeys.dbPassword }}: {{ .Values.secrets.values.dbPassword | default "" | quote }}
  {{ .Values.secretKeys.s3AccessKeyId }}: {{ .Values.secrets.values.s3AccessKeyId | default "" | quote }}
  {{ .Values.secretKeys.s3SecretAccessKey }}: {{ .Values.secrets.values.s3SecretAccessKey | default "" | quote }}
{{- end }}
