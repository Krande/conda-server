apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conda-server.fullname" . }}
  labels:
    {{- include "conda-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 2
  strategy:
    # Stateless once the DB + S3 are externalised — surge-up rolling
    # update gives zero-downtime deploys.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "conda-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "conda-server.selectorLabels" . | nindent 8 }}
      annotations:
        # Re-roll on Secret/values change so a new sessionSecret or
        # OIDC creds take effect without the operator manually
        # restarting the pods.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.metrics.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        # Block until the bundled Postgres accepts connections —
        # otherwise the API pod crashloops while the DB StatefulSet is
        # still booting on a fresh install.
        - name: wait-for-db
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              until nc -z {{ include "conda-server.fullname" . }}-db 5432; do
                echo "waiting for db..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: api
          image: {{ include "conda-server.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            # rustls (used by obstore) reads the system CA bundle from
            # /etc/ssl/certs by default; the slim runtime drops apt for
            # CI reliability and ships the pixi env's bundle instead.
            - name: SSL_CERT_FILE
              value: "/app/.pixi/envs/default/ssl/cacert.pem"
            - name: CONDA_SERVER_HOST
              value: "0.0.0.0"
            - name: CONDA_SERVER_PORT
              value: {{ .Values.service.port | quote }}
            - name: CONDA_SERVER_BASE_URL
              value: {{ .Values.app.baseUrl | quote }}
            # DB password is its own var — kept outside the
            # CONDA_SERVER_ namespace so pydantic-settings doesn't try
            # to parse it as an unknown DatabaseSettings field — and
            # then stitched into the URL via $(DB_PASSWORD).
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "conda-server.secretName" . }}
                  key: {{ .Values.secretKeys.dbPassword }}
                  optional: {{ not .Values.postgresql.enabled }}
            - name: CONDA_SERVER_DATABASE__URL
              value: {{ include "conda-server.dbUrl" . | quote }}
            - name: CONDA_SERVER_STORAGE__BACKEND
              value: {{ .Values.storage.backend | quote }}
            - name: CONDA_SERVER_STORAGE__URL
              value: {{ .Values.storage.url | quote }}
            {{- with .Values.storage.endpoint }}
            - name: CONDA_SERVER_STORAGE__ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.storage.region }}
            - name: CONDA_SERVER_STORAGE__REGION
              value: {{ . | quote }}
            {{- end }}
            - name: CONDA_SERVER_STORAGE__PRESIGN_TTL_SECONDS
              value: {{ .Values.storage.presignTtlSeconds | quote }}
            {{- if eq .Values.storage.backend "s3" }}
            - name: CONDA_SERVER_STORAGE__ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "conda-server.secretName" . }}
                  key: {{ .Values.secretKeys.s3AccessKeyId }}
                  optional: true
            - name: CONDA_SERVER_STORAGE__SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "conda-server.secretName" . }}
                  key: {{ .Values.secretKeys.s3SecretAccessKey }}
                  optional: true
            {{- end }}
            - name: CONDA_SERVER_LOGGING__FORMAT
              value: {{ .Values.app.logFormat | quote }}
            - name: CONDA_SERVER_AUTH__SESSION_HTTPS_ONLY
              value: {{ .Values.app.sessionHttpsOnly | quote }}
            - name: CONDA_SERVER_AUTH__INITIAL_ADMINS
              value: {{ .Values.app.initialAdmins | toJson | quote }}
            - name: CONDA_SERVER_AUTH__SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "conda-server.secretName" . }}
                  key: {{ .Values.secretKeys.sessionSecret }}
            - name: CONDA_SERVER_UPLOAD__MAX_FILE_BYTES
              value: {{ .Values.app.uploadMaxFileBytes | quote }}
            - name: CONDA_SERVER_UPLOAD__MAX_TOTAL_BYTES
              value: {{ .Values.app.uploadMaxTotalBytes | quote }}
            - name: CONDA_SERVER_CLEANUP__IMPORT_JOB_TTL_DAYS
              value: {{ .Values.app.cleanupImportJobTtlDays | quote }}
            - name: CONDA_SERVER_CLEANUP__INTERVAL_SECONDS
              value: {{ .Values.app.cleanupIntervalSeconds | quote }}
            - name: CONDA_SERVER_CLEANUP__ABOUT_BACKFILL_PER_SWEEP
              value: {{ .Values.app.cleanupAboutBackfillPerSweep | quote }}
            {{- with .Values.app.oidc.issuer }}
            - name: CONDA_SERVER_AUTH__OIDC__ISSUER
              value: {{ . | quote }}
            - name: CONDA_SERVER_AUTH__OIDC__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "conda-server.secretName" $ }}
                  key: {{ $.Values.secretKeys.oidcClientId }}
            - name: CONDA_SERVER_AUTH__OIDC__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "conda-server.secretName" $ }}
                  key: {{ $.Values.secretKeys.oidcClientSecret }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
